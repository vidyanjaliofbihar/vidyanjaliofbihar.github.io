}


function filterMembershipApplications() {
  const search = document
    .getElementById("memberSearch")
    .value.trim().toLowerCase();

  const status = document
    .getElementById("statusFilter")
    .value;

  const applications =
    window.allMembershipApplications || [];

  const filtered = applications.filter(a => {
    const searchText = [
      a.full_name,
      a.mobile,
      a.membership_id
    ].map(value => String(value ?? "").toLowerCase())
     .join(" ");

    const matchesSearch = searchText.includes(search);

    const matchesStatus =
      status === "all" ||
      a.application_status === status;

    return matchesSearch && matchesStatus;
  });

  document.querySelectorAll(
    "#applicationsBody tr"
  ).forEach(row => {
    const application = applications.find(
      a => a.id === row.dataset.applicationId
    );

    row.style.display =
      application && filtered.some(a => a.id === application.id)
        ? ""
        : "none";
  });
}

document.getElementById("memberSearch")

async function loadPrivateMemberPhoto(photoPath, section, modal, applicationId) {
  const status = document.createElement("p");
  status.className = "member-photo-status";
  status.textContent = "Loading member photo...";
  section.appendChild(status);

  if (!photoPath) {
    status.textContent = "No photograph uploaded.";
    return;
  }

  const { data, error } = await db.storage
    .from("member-photos")
    .download(photoPath);

  if (
    modal.hidden ||
    modal.dataset.applicationId !== applicationId
  ) {
    return;
  }

  if (error || !data) {
    status.textContent = "Unable to load member photo.";
    console.error("Photo download error:", error);
    return;
  }

  const imageUrl = URL.createObjectURL(data);
  const image = document.createElement("img");

  image.className = "member-photo";
  image.alt = "Member passport photograph";

  image.onload = () => URL.revokeObjectURL(imageUrl);
  image.onerror = () => {
    URL.revokeObjectURL(imageUrl);
    status.textContent = "Unable to display member photo.";
  };

  image.src = imageUrl;
  section.insertBefore(image, status);
  status.textContent = "Member Photograph";
}

async function viewMemberDetails(applicationId) {
  const modal = document.getElementById("memberDetailsModal");
  const content = document.getElementById("memberDetailsContent");

  if (!modal || !content) {
    alert("Member details popup is not configured.");
    return;
  }

  content.replaceChildren();
  const loading = document.createElement("p");
  loading.textContent = "Loading member details...";
  content.appendChild(loading);

modal.dataset.applicationId = applicationId;
  
  modal.hidden = false;

  try {
    const { data: isAdmin, error: adminError } =
      await db.rpc("is_super_admin");

    if (adminError || isAdmin !== true) {
      throw new Error("Super Admin permission required.");
    }

    const { data, error } = await db
      .from("membership_applications")
      .select("*")
      .eq("id", applicationId)
      .single();

    if (error) throw error;

    if (!data) {
      throw new Error("Application not found.");
    }

    // Labels for known membership fields
    const fieldLabels = {
      id: "Application ID",
      full_name: "Full Name",
      father_name: "Father's Name",
      husband_name: "Husband's Name",
      date_of_birth: "Date of Birth",
      gender: "Gender",
      mobile: "Mobile Number",
      email: "Email Address",
      address: "Address",
      village: "Village",
      district: "District",
      state: "State",
      pincode: "PIN Code",
      qualification: "Qualification",
      occupation: "Occupation",
      application_status: "Application Status",
      membership_id: "Membership ID",
      applied_at: "Application Date",
      approved_at: "Approval Date"
    };

    const excludedFields = new Set([
      "password",
      "password_hash",
      "access_token",
      "refresh_token",
      "secret",
      "secret_key"
    ]);

    const grid = document.createElement("div");
    grid.className = "member-details-grid";

    Object.entries(data).forEach(([key, value]) => {
      if (excludedFields.has(key.toLowerCase())) return;

      const item = document.createElement("div");
      item.className = "member-detail-item";

      const label = document.createElement("div");
      label.className = "member-detail-label";
      label.textContent = fieldLabels[key] ||
        key.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());

      const valueElement = document.createElement("div");
      valueElement.className = "member-detail-value";

      valueElement.textContent =
        value === null || value === ""
          ? "Not provided"
          : typeof value === "object"
            ? JSON.stringify(value)
            : String(value);

      item.appendChild(label);
      item.appendChild(valueElement);
      grid.appendChild(item);
    });

    // Prevent an older request from replacing a newer view
    if (modal.dataset.applicationId !== applicationId) return;

    content.replaceChildren(grid);
    
const photoSection = document.createElement("div");
photoSection.className = "member-photo-section";

content.replaceChildren(photoSection, grid);

await loadPrivateMemberPhoto(
  data.photo_path,
  photoSection,
  modal,
  applicationId
);


  } catch (error) {
    if (modal.dataset.applicationId !== applicationId) return;

    content.replaceChildren();

    const errorText = document.createElement("p");
    errorText.textContent =
      "Unable to load member details: " + error.message;

    content.appendChild(errorText);
  }
}
  

async function generateMemberIdCard(applicationId) {
  const button = Array.from(
    document.querySelectorAll("#applicationsBody button")
  ).find(btn =>
    btn.textContent === "Generate ID Card" &&
    btn.closest("tr")?.dataset.applicationId === applicationId
  );

  if (button) {
    button.disabled = true;
    button.textContent = "Generating...";
  }

  try {
    const { data: isAdmin, error: adminError } =
      await db.rpc("is_super_admin");

    if (adminError || isAdmin !== true) {
      throw new Error("Super Admin permission required.");
    }

    const { data: member, error } = await db
      .from("membership_applications")
      .select("full_name, membership_id, application_status, approved_at, photo_path")
      .eq("id", applicationId)
      .single();

    if (error) throw error;

    if (
      !member ||
      member.application_status !== "approved" ||
      !member.membership_id
    ) {
      throw new Error("Only approved members can receive ID cards.");
    }

    if (!window.jspdf?.jsPDF) {
      throw new Error("PDF library is not loaded.");
    }

    const { jsPDF } = window.jspdf;

    // CR80 landscape card: 85.6 x 53.98 mm
    const pdf = new jsPDF({
      orientation: "landscape",
      unit: "mm",
      format: [85.6, 53.98]
    });

    const W = 85.6;
    const H = 53.98;

    const navy = [16, 43, 80];
    const gold = [200, 156, 69];

    const issueDate = member.approved_at
      ? new Date(member.approved_at).toLocaleDateString("en-GB", {
          day: "2-digit",
          month: "short",
          year: "numeric"
        })
      : "Not available";

    function cardBackground() {
      pdf.setFillColor(255, 255, 255);
      pdf.rect(0, 0, W, H, "F");

      pdf.setDrawColor(...gold);
      pdf.setLineWidth(0.5);
      pdf.rect(1.2, 1.2, W - 2.4, H - 2.4);
    }

    function header() {
      pdf.setFillColor(...navy);
      pdf.rect(0, 0, W, 15, "F");

      pdf.setTextColor(255, 255, 255);
      pdf.setFont("helvetica", "bold");
      pdf.setFontSize(12);
      pdf.text("VIDYANJALI OF BIHAR", W / 2, 7, {
        align: "center"
      });

      pdf.setFont("helvetica", "normal");
      pdf.setFontSize(6.5);
      pdf.text(
        "Transformation through Education",
        W / 2,
        11.5,
        { align: "center" }
      );
    }

    // FRONT SIDE
    cardBackground();
    header();

    pdf.setTextColor(...navy);
    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(8);
    pdf.text("MEMBERSHIP ID CARD", W / 2, 19, {
      align: "center"
    });

    // Member photograph
    if (member.photo_path) {
      const { data: photo, error: photoError } =
        await db.storage
          .from("member-photos")
          .download(member.photo_path);

      if (photoError) throw photoError;

      const photoData = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(
          new Error("Unable to read member photograph.")
        );
        reader.readAsDataURL(photo);
      });

      pdf.addImage(photoData, "JPEG", 5, 22, 22, 27);
    } else {
      pdf.setDrawColor(...gold);
      pdf.rect(5, 22, 22, 27);
      pdf.setFontSize(7);
      pdf.text("NO PHOTO", 16, 36, { align: "center" });
    }

    const name = String(member.full_name || "Member");
    const nameLines = pdf.splitTextToSize(name, 49).slice(0, 2);

    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(9);
    pdf.setTextColor(...navy);
    pdf.text(nameLines, 31, 28);

    const detailsY = 30 + nameLines.length * 4;

    pdf.setFont("helvetica", "normal");
    pdf.setFontSize(7.5);

    pdf.text("Member ID:", 31, detailsY);
    pdf.setFont("helvetica", "bold");
    pdf.text(String(member.membership_id), 47, detailsY);

    pdf.setFont("helvetica", "normal");
    pdf.text("Issue Date:", 31, detailsY + 6);
    pdf.text(issueDate, 47, detailsY + 6);

    pdf.setFillColor(...navy);
    pdf.rect(0, H - 2.5, W, 2.5, "F");

    // BACK SIDE
    pdf.addPage([85.6, 53.98], "landscape");
    cardBackground();
    header();

    pdf.setTextColor(...navy);
    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(9);
    pdf.text("MEMBERSHIP INFORMATION", W / 2, 21, {
      align: "center"
    });

    pdf.setFont("helvetica", "normal");
    pdf.setFontSize(7.5);

    pdf.text(
      "This card identifies the holder as a member of",
      W / 2,
      28,
      { align: "center" }
    );

    pdf.text(
      "Vidyanjali of Bihar.",
      W / 2,
      32,
      { align: "center" }
    );

    pdf.setFont("helvetica", "bold");
    pdf.text("Authorized Signatory", W / 2, 40, {
      align: "center"
    });

    pdf.setFont("helvetica", "normal");
    pdf.setFontSize(7);
    pdf.text("vidyanjaliofbihar.com", W / 2, 46, {
      align: "center"
    });

    pdf.setFontSize(5.5);
    pdf.text(
      "Not a government-issued identity document",
      W / 2,
      50,
      { align: "center" }
    );

    pdf.save(
      `VOB-ID-Card-${member.membership_id}.pdf`
    );

  } catch (error) {
    console.error("ID Card generation error:", error);
    alert("Unable to generate ID Card: " + error.message);
  } finally {
    if (button) {
      button.disabled = false;
      button.textContent = "Generate ID Card";
    }
  }
}

async function reviewApplication(applicationId, decision) {

  if (!["approved", "rejected"].includes(decision)) {
    alert("Invalid decision.");
    return;
  }

  const action = decision === "approved" ? "APPROVE" : "REJECT";

  const confirmed = confirm(
    `Are you sure you want to ${action} this membership application?`
  );

  if (!confirmed) return;

  const statusMessage =
    document.getElementById("dashboardMessage");

  statusMessage.textContent =
    `Processing ${decision} request...`;

  try {

    const { data, error } = await db.rpc(
      "review_membership_application",
      {
        p_application_id: applicationId,
        p_decision: decision
      }
    );

    if (error) {
      throw error;
    }

    alert(
      decision === "approved"
        ? "Membership application approved successfully."
        : "Membership application rejected successfully."
    );

    await loadApplications();

  } catch (error) {

    console.error("Review error:", error);

    statusMessage.textContent =
      "Unable to review application: " + error.message;

    alert("Action failed: " + error.message);
  }
}


function closeMemberDetails() {
  const modal = document.getElementById("memberDetailsModal");

  modal.hidden = true;
  delete modal.dataset.applicationId;
}

document.getElementById("closeMemberDetails")
  .addEventListener("click", closeMemberDetails);

document.getElementById("memberDetailsModal")
  .addEventListener("click", event => {
    if (event.target.id === "memberDetailsModal") {
      closeMemberDetails();
    }
  });

document.addEventListener("keydown", event => {
  if (
    event.key === "Escape" &&
    !document.getElementById("memberDetailsModal").hidden
  ) {
    closeMemberDetails();
  }
});

  
document.getElementById("logoutBtn")
  .addEventListener("click", async () => {
    const { error } = await db.auth.signOut();

    if (error) {
      alert("Logout failed: " + error.message);
      return;
    }

    window.location.reload();
  });

  
</script>
