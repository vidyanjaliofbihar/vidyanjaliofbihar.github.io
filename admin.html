
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Vidyanjali of Bihar</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5fa;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      background: white;
      padding: 35px;
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
      text-align: center;
    }

    h2 { color: #102b50; }
    p { color: #64748b; }

    input {
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      border: 1px solid #ccd5e0;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      border: none;
      border-radius: 6px;
      background: #102b50;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover { background: #1d4678; }

    #message {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Vidyanjali of Bihar</h2>
    <p>Super Admin Login</p>

    <form id="loginForm">
      <input type="email" id="email"
             placeholder="Admin Email" required>

      <input type="password" id="password"
             placeholder="Password" required>

      <button type="submit">Login</button>
    </form>

    <p id="message"></p>
  </div>

  <script>
    document.getElementById("loginForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        document.getElementById("message").textContent =
          "Login integration is being configured.";
      });
  </script>

</body>
</html>
