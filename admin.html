
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Vidyanjali of Bihar</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5fa;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      background: white;
      padding: 35px;
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
      text-align: center;
    }

    h2 { color: #102b50; }
    p { color: #64748b; }

    input {
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      border: 1px solid #ccd5e0;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      border: none;
      border-radius: 6px;
      background: #102b50;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover { background: #1d4678; }

    #message {
      margin-top: 15px;
      font-size: 14px;
    }


.dashboard {
  display: none;
  width: 100%;
  max-width: 1100px;
  margin: 30px auto;
}

.dashboard-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
}

.dashboard-header h2 { margin-bottom: 5px; }

.logout-btn {
  width: auto;
  padding: 11px 22px;
  background: #b91c1c;
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 15px;
  margin: 25px 0;
}

.stat-card {
  background: white;
  border-radius: 10px;
  padding: 22px;
  box-shadow: 0 3px 12px rgba(0,0,0,.05);
}

.stat-card h3 {
  font-size: 28px;
  color: #102b50;
  margin: 0 0 8px;
}

.stat-card p { margin: 0; }

.table-container {
  background: white;
  padding: 20px;
  border-radius: 10px;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 650px;
}

th, td {
  text-align: left;
  padding: 13px;
  border-bottom: 1px solid #e2e8f0;
}

th { background: #f1f5f9; }

#dashboardMessage { color: #475569; }

    
.member-filters {
  display: flex;
  gap: 15px;
  margin: 20px 0;
  flex-wrap: wrap;
  align-items: center;
}

.member-filters input,
.member-filters select {
  padding: 12px 14px;
  border: 1px solid #ccd5e0;
  border-radius: 7px;
  background: #ffffff;
  color: #102b50;
  font-size: 14px;
  margin: 0;
}

.member-filters input {
  flex: 1;
  min-width: 220px;
}

.member-filters select {
  width: 190px;
  max-width: 100%;
  cursor: pointer;
}

@media (max-width: 600px) {
  .member-filters {
    flex-direction: column;
    align-items: stretch;
  }

  .member-filters input,
  .member-filters select {
    width: 100%;
    min-width: 0;
  }
}


/* Step 37B - Member Details Modal */

.member-modal[hidden] {
  display: none !important;
}

.member-modal {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(15, 23, 42, 0.65);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  overflow-y: auto;
}

.member-modal-content {
  background: #ffffff;
  width: 100%;
  max-width: 750px;
  max-height: 90vh;
  overflow-y: auto;
  border-radius: 12px;
  padding: 25px;
  box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
}

.member-modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  border-bottom: 1px solid #e2e8f0;
  padding-bottom: 15px;
  margin-bottom: 20px;
}

.member-modal-header h2 {
  color: #102b50;
  font-size: 22px;
  margin: 0;
}

.member-modal-close {
  width: 38px;
  height: 38px;
  padding: 0;
  margin: 0;
  background: #e2e8f0;
  color: #102b50;
  border-radius: 50%;
  font-size: 26px;
  cursor: pointer;
  flex-shrink: 0;
}

.member-modal-close:hover {
  background: #cbd5e1;
}

.member-details-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 15px;
}

.member-detail-item {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  padding: 14px;
  min-width: 0;
}

.member-detail-label {
  font-size: 12px;
  color: #64748b;
  margin-bottom: 6px;
  font-weight: 600;
}

.member-detail-value {
  font-size: 15px;
  color: #102b50;
  font-weight: 500;
  overflow-wrap: anywhere;
}

@media (max-width: 600px) {
  .member-modal {
    padding: 10px;
  }

  .member-modal-content {
    padding: 18px;
    max-height: 95vh;
  }

  .member-modal-header h2 {
    font-size: 18px;
  }

  .member-details-grid {
    grid-template-columns: 1fr;
  }
}

    
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Vidyanjali of Bihar</h2>
    <p>Super Admin Login</p>

    <form id="loginForm">
      <input type="email" id="email"
             placeholder="Admin Email" required>

      <input type="password" id="password"
             placeholder="Password" required>

      <button type="submit">Login</button>
    </form>

    <p id="message"></p>
  </div>


<section id="dashboard" class="dashboard">
  <div class="dashboard-header">
    <div>
      <h2>Vidyanjali of Bihar</h2>
      <p>Super Admin Dashboard</p>
    </div>
    <button id="logoutBtn" class="logout-btn">
      Logout
    </button>
  </div>

  <div class="stats">
    <div class="stat-card">
      <h3 id="totalCount">0</h3>
      <p>Total Applications</p>
    </div>
    <div class="stat-card">
      <h3 id="pendingCount">0</h3>
      <p>Pending</p>
    </div>
    <div class="stat-card">
      <h3 id="approvedCount">0</h3>
      <p>Approved</p>
    </div>
    <div class="stat-card">
      <h3 id="rejectedCount">0</h3>
      <p>Rejected</p>
    </div>
  </div>

  <div class="table-container">
    <h2>Membership Applications</h2>

    <div class="member-filters">
  <input
    type="search"
    id="memberSearch"
    placeholder="Search name, mobile or membership ID"
    aria-label="Search membership applications"
  >

  <select id="statusFilter" aria-label="Filter by application status">
    <option value="all">All Applications</option>
    <option value="pending">Pending</option>
    <option value="approved">Approved</option>
    <option value="rejected">Rejected</option>
  </select>
</div>
    <p id="dashboardMessage">Loading...</p>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Mobile</th>
          <th>District</th>
          <th>Status</th>
          <th>Membership ID</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="applicationsBody"></tbody>
    </table>
  </div>
</section>


<!-- Member Details Popup -->
<div id="memberDetailsModal"
     class="member-modal"
     role="dialog"
     aria-modal="true"
     aria-labelledby="memberDetailsTitle"
     hidden>

  <div class="member-modal-content">

    <div class="member-modal-header">
      <h2 id="memberDetailsTitle">
        Membership Application Details
      </h2>

      <button
        type="button"
        id="closeMemberDetails"
        class="member-modal-close"
        aria-label="Close member details">
        &times;
      </button>
    </div>

    <div id="memberDetailsContent">
      <p>Loading member details...</p>
    </div>

  </div>
</div>

  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL =
    "https://iwlfhyadwukeyqskfjoq.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_yucuXDMfZYhzHIv_N8KEUg_bhnm6Ay3";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const form = document.getElementById("loginForm");
  const message = document.getElementById("message");
  const loginButton = form.querySelector("button");

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    loginButton.disabled = true;
    message.textContent = "Checking login credentials...";

    try {
      const { error: loginError } =
        await db.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (loginError) {
        message.textContent = "Login failed: " + loginError.message;
        return;
      }

      message.textContent = "Checking admin permission...";

      const { data: isAdmin, error: adminError } =
        await db.rpc("is_super_admin");

      if (adminError || isAdmin !== true) {
        await db.auth.signOut();
        message.textContent = "Access denied. Super Admin only.";
        return;
      }

      message.textContent =
        "Login successful. Super Admin verified.";

      // Dashboard integration will be added next.
      await showDashboard();

    } catch (error) {
      message.textContent =
        "Unable to complete login. Please try again.";
      console.error("Login error:", error);
    } finally {
      loginButton.disabled = false;
    }
  });


async function showDashboard() {
  document.querySelector(".login-box").style.display = "none";
  document.body.style.display = "block";
  document.getElementById("dashboard").style.display = "block";

  await loadApplications();
}


function filterMembershipApplications() {
  const search = document
    .getElementById("memberSearch")
    .value.trim().toLowerCase();

  const status = document
    .getElementById("statusFilter")
    .value;

  const applications =
    window.allMembershipApplications || [];

  const filtered = applications.filter(a => {
    const searchText = [
      a.full_name,
      a.mobile,
      a.membership_id
    ].map(value => String(value ?? "").toLowerCase())
     .join(" ");

    const matchesSearch = searchText.includes(search);

    const matchesStatus =
      status === "all" ||
      a.application_status === status;

    return matchesSearch && matchesStatus;
  });

  document.querySelectorAll(
    "#applicationsBody tr"
  ).forEach(row => {
    const application = applications.find(
      a => a.id === row.dataset.applicationId
    );

    row.style.display =
      application && filtered.some(a => a.id === application.id)
        ? ""
        : "none";
  });
}

document.getElementById("memberSearch")
  .addEventListener("input", filterMembershipApplications);

document.getElementById("statusFilter")
  .addEventListener("change", filterMembershipApplications);

  
async function loadApplications() {
  const statusMessage =
    document.getElementById("dashboardMessage");

  statusMessage.textContent = "Loading applications...";

  const { data, error } = await db
    .from("membership_applications")
    .select("id, full_name, mobile, district, application_status, membership_id")
    .order("applied_at", { ascending: false });

  if (error) {
    statusMessage.textContent =
      "Unable to load applications: " + error.message;
    return;
  }

  const applications = data || [];
  
window.allMembershipApplications = applications;


  document.getElementById("totalCount").textContent =
    applications.length;

  document.getElementById("pendingCount").textContent =
    applications.filter(a => a.application_status === "pending").length;

  document.getElementById("approvedCount").textContent =
    applications.filter(a => a.application_status === "approved").length;

  document.getElementById("rejectedCount").textContent =
    applications.filter(a => a.application_status === "rejected").length;

  const tbody = document.getElementById("applicationsBody");
  tbody.replaceChildren();

  applications.forEach(application => {
    const row = document.createElement("tr");
    row.dataset.applicationId = application.id;

    [
      application.full_name,
      application.mobile,
      application.district,
      application.application_status,
      application.membership_id
    ].forEach(value => {
      const cell = document.createElement("td");
      cell.textContent = value ?? "-";
      row.appendChild(cell);
    });


    // Action buttons for pending applications
const actionCell = document.createElement("td");

 
const viewBtn = document.createElement("button");

viewBtn.textContent = "View Details";
viewBtn.type = "button";
viewBtn.style.background = "#102b50";
viewBtn.style.width = "auto";
viewBtn.style.margin = "3px";
viewBtn.style.padding = "8px 12px";

viewBtn.addEventListener("click", async () => {
  await viewMemberDetails(application.id);
});

actionCell.appendChild(viewBtn);
   
    
if (application.application_status === "pending") {

  const approveBtn = document.createElement("button");
  approveBtn.textContent = "Approve";
  approveBtn.style.background = "#15803d";
  approveBtn.style.width = "auto";
  approveBtn.style.margin = "3px";
  approveBtn.style.padding = "8px 12px";

  const rejectBtn = document.createElement("button");
  rejectBtn.textContent = "Reject";
  rejectBtn.style.background = "#b91c1c";
  rejectBtn.style.width = "auto";
  rejectBtn.style.margin = "3px";
  rejectBtn.style.padding = "8px 12px";

  approveBtn.addEventListener("click", async () => {
    await reviewApplication(application.id, "approved");
  });

  rejectBtn.addEventListener("click", async () => {
    await reviewApplication(application.id, "rejected");
  });

  actionCell.appendChild(approveBtn);
  actionCell.appendChild(rejectBtn);

} else {
  actionCell.textContent = "Reviewed";
}

row.appendChild(actionCell);
    
    tbody.appendChild(row);
  });

  statusMessage.textContent =
    applications.length
      ? `${applications.length} application(s) loaded.`
      : "No applications found.";

  filterMembershipApplications();
}


async function viewMemberDetails(applicationId) {
  const modal = document.getElementById("memberDetailsModal");
  const content = document.getElementById("memberDetailsContent");

  if (!modal || !content) {
    alert("Member details popup is not configured.");
    return;
  }

  content.replaceChildren();
  const loading = document.createElement("p");
  loading.textContent = "Loading member details...";
  content.appendChild(loading);

modal.dataset.applicationId = applicationId;
  
  modal.hidden = false;

  try {
    const { data: isAdmin, error: adminError } =
      await db.rpc("is_super_admin");

    if (adminError || isAdmin !== true) {
      throw new Error("Super Admin permission required.");
    }

    const { data, error } = await db
      .from("membership_applications")
      .select("*")
      .eq("id", applicationId)
      .single();

    if (error) throw error;

    if (!data) {
      throw new Error("Application not found.");
    }

    // Labels for known membership fields
    const fieldLabels = {
      id: "Application ID",
      full_name: "Full Name",
      father_name: "Father's Name",
      husband_name: "Husband's Name",
      date_of_birth: "Date of Birth",
      gender: "Gender",
      mobile: "Mobile Number",
      email: "Email Address",
      address: "Address",
      village: "Village",
      district: "District",
      state: "State",
      pincode: "PIN Code",
      qualification: "Qualification",
      occupation: "Occupation",
      application_status: "Application Status",
      membership_id: "Membership ID",
      applied_at: "Application Date",
      approved_at: "Approval Date"
    };

    const excludedFields = new Set([
      "password",
      "password_hash",
      "access_token",
      "refresh_token",
      "secret",
      "secret_key"
    ]);

    const grid = document.createElement("div");
    grid.className = "member-details-grid";

    Object.entries(data).forEach(([key, value]) => {
      if (excludedFields.has(key.toLowerCase())) return;

      const item = document.createElement("div");
      item.className = "member-detail-item";

      const label = document.createElement("div");
      label.className = "member-detail-label";
      label.textContent = fieldLabels[key] ||
        key.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());

      const valueElement = document.createElement("div");
      valueElement.className = "member-detail-value";

      valueElement.textContent =
        value === null || value === ""
          ? "Not provided"
          : typeof value === "object"
            ? JSON.stringify(value)
            : String(value);

      item.appendChild(label);
      item.appendChild(valueElement);
      grid.appendChild(item);
    });

    // Prevent an older request from replacing a newer view
    if (modal.dataset.applicationId !== applicationId) return;

    content.replaceChildren(grid);

  } catch (error) {
    if (modal.dataset.applicationId !== applicationId) return;

    content.replaceChildren();

    const errorText = document.createElement("p");
    errorText.textContent =
      "Unable to load member details: " + error.message;

    content.appendChild(errorText);
  }
}
  

async function reviewApplication(applicationId, decision) {

  if (!["approved", "rejected"].includes(decision)) {
    alert("Invalid decision.");
    return;
  }

  const action = decision === "approved" ? "APPROVE" : "REJECT";

  const confirmed = confirm(
    `Are you sure you want to ${action} this membership application?`
  );

  if (!confirmed) return;

  const statusMessage =
    document.getElementById("dashboardMessage");

  statusMessage.textContent =
    `Processing ${decision} request...`;

  try {

    const { data, error } = await db.rpc(
      "review_membership_application",
      {
        p_application_id: applicationId,
        p_decision: decision
      }
    );

    if (error) {
      throw error;
    }

    alert(
      decision === "approved"
        ? "Membership application approved successfully."
        : "Membership application rejected successfully."
    );

    await loadApplications();

  } catch (error) {

    console.error("Review error:", error);

    statusMessage.textContent =
      "Unable to review application: " + error.message;

    alert("Action failed: " + error.message);
  }
}


function closeMemberDetails() {
  const modal = document.getElementById("memberDetailsModal");

  modal.hidden = true;
  delete modal.dataset.applicationId;
}

document.getElementById("closeMemberDetails")
  .addEventListener("click", closeMemberDetails);

document.getElementById("memberDetailsModal")
  .addEventListener("click", event => {
    if (event.target.id === "memberDetailsModal") {
      closeMemberDetails();
    }
  });

document.addEventListener("keydown", event => {
  if (
    event.key === "Escape" &&
    !document.getElementById("memberDetailsModal").hidden
  ) {
    closeMemberDetails();
  }
});

  
document.getElementById("logoutBtn")
  .addEventListener("click", async () => {
    const { error } = await db.auth.signOut();

    if (error) {
      alert("Logout failed: " + error.message);
      return;
    }

    window.location.reload();
  });

  
</script>


</body>
