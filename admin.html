
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Vidyanjali of Bihar</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5fa;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      background: white;
      padding: 35px;
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
      text-align: center;
    }

    h2 { color: #102b50; }
    p { color: #64748b; }

    input {
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      border: 1px solid #ccd5e0;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      border: none;
      border-radius: 6px;
      background: #102b50;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover { background: #1d4678; }

    #message {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Vidyanjali of Bihar</h2>
    <p>Super Admin Login</p>

    <form id="loginForm">
      <input type="email" id="email"
             placeholder="Admin Email" required>

      <input type="password" id="password"
             placeholder="Password" required>

      <button type="submit">Login</button>
    </form>

    <p id="message"></p>
  </div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL =
    "https://iwlfhyadwukeyqskfjog.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_yucuXDMfZYhzHIv_N8KEUg_bhnm6Ay3";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const form = document.getElementById("loginForm");
  const message = document.getElementById("message");
  const loginButton = form.querySelector("button");

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    loginButton.disabled = true;
    message.textContent = "Checking login credentials...";

    try {
      const { error: loginError } =
        await db.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (loginError) {
        message.textContent = "Login failed: " + loginError.message;
        return;
      }

      message.textContent = "Checking admin permission...";

      const { data: isAdmin, error: adminError } =
        await db.rpc("is_super_admin");

      if (adminError || isAdmin !== true) {
        await db.auth.signOut();
        message.textContent = "Access denied. Super Admin only.";
        return;
      }

      message.textContent =
        "Login successful. Super Admin verified.";

      // Dashboard integration will be added next.

    } catch (error) {
      message.textContent =
        "Unable to complete login. Please try again.";
      console.error("Login error:", error);
    } finally {
      loginButton.disabled = false;
    }
  });
</script>


</body>
</html>
